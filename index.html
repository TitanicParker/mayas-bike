<!doctype html>

<title>Maya's Bike</title>
<meta name="description" content="Maya's Bike — a book about the tiny completions hidden inside ordinary human life.">
<style>
:root{--paper:#f6f1e7;--ink:#201d19;--muted:#756e64;--rule:rgba(32,29,25,.12);--accent:#7a4b36;--measure:43rem;--serif:Georgia,'Times New Roman',Times,serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font:20px/1.72 var(--serif);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}a{color:inherit}
.cover{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;align-items:center;padding:clamp(1.4rem,3vw,2.4rem);background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.72),transparent 30rem),linear-gradient(180deg,#faf6ee,var(--paper));overflow:hidden}.cover-title{margin:0;text-align:center;font-size:clamp(3.6rem,10vw,8.4rem);font-weight:500;line-height:.88;letter-spacing:-.055em}.cover-art{width:min(100%,72rem);margin:auto}.cover-art svg{display:block;width:100%;height:auto;max-height:68svh}.continue{display:flex;flex-direction:column;align-items:center;gap:.45rem;padding:.8rem 0 .2rem;color:var(--muted);font:650 .68rem/1 var(--sans);letter-spacing:.15em;text-transform:uppercase}.continue span:last-child{font-size:1rem;letter-spacing:0;animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
.book{width:min(calc(100% - 2.2rem),var(--measure));margin:0 auto;padding:clamp(5rem,10vw,9rem) 0 10rem}.loading,.error{color:var(--muted);font:.9rem/1.5 var(--sans)}article>:first-child{margin-top:0}article h1,article h2,article h3{font-family:var(--serif);font-weight:500;line-height:1.08;text-wrap:balance}article h1{margin:0 0 5rem;text-align:center;font-size:clamp(1.15rem,2vw,1.35rem);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}article h2{margin:7rem 0 2.4rem;padding-top:1.6rem;border-top:1px solid var(--rule);font-size:clamp(2rem,5vw,3.25rem);letter-spacing:-.03em}article h2:first-of-type{margin-top:0;padding-top:0;border-top:0}article h3{margin:4rem 0 1.4rem;font-size:1.5rem}article p{margin:0 0 1.35rem;hanging-punctuation:first last}article blockquote{margin:2.8rem 0;padding:.2rem 0 .2rem 1.5rem;border-left:2px solid var(--accent);font-size:1.08em;color:#433c35}article ul,article ol{padding-left:1.4rem;margin:1.5rem 0 2rem}article li{margin:.5rem 0}article hr{width:4rem;margin:5rem auto;border:0;border-top:1px solid var(--rule)}article strong{font-weight:700}article em{font-style:italic}article code{font:.83em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:rgba(122,75,54,.08);padding:.1em .25em;border-radius:.2em}.end{width:min(calc(100% - 2.2rem),var(--measure));margin:0 auto 2.5rem;padding-top:1.4rem;border-top:1px solid var(--rule);color:var(--muted);text-align:center;font:.7rem/1.5 var(--sans)}.end a{text-decoration:none}
@media(max-width:640px){body{font-size:18px;line-height:1.68}.cover{padding:1rem}.cover-title{font-size:clamp(3.4rem,18vw,5.8rem)}.cover-art svg{max-height:64svh}.book{width:min(calc(100% - 2rem),var(--measure));padding-top:4.7rem}article h1{margin-bottom:4rem}article h2{margin-top:5.5rem}.end{width:min(calc(100% - 2rem),var(--measure))}}
@media(prefers-color-scheme:dark){:root{--paper:#171512;--ink:#efe9df;--muted:#aaa194;--rule:rgba(239,233,223,.14);--accent:#d49a76}.cover{background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.035),transparent 30rem),var(--paper)}article blockquote{color:#d4cabd}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.continue span:last-child{animation:none}}
@media print{.cover,.end{display:none}.book{width:100%;max-width:38em;padding:0}body{background:#fff;color:#000;font-size:12pt}article h2{break-before:page;border-top:0}}
</style>
</head>

<footer class="end"><a href="https://titanicparker.github.io/">TitanicParker</a> · <a href="https://github.com/TitanicParker/mayas-bike">source</a></footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>
const manuscript=document.getElementById('manuscript');
const manuscriptUrl='https://raw.githubusercontent.com/TitanicParker/mayas-bike/main/manuscript.md';
marked.setOptions({gfm:true,breaks:false,mangle:false,headerIds:true});
(async()=>{try{const response=await fetch(manuscriptUrl,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const markdown=await response.text();manuscript.innerHTML=DOMPurify.sanitize(marked.parse(markdown));}catch(error){manuscript.innerHTML='<div class="error"><p>The book could not be opened just now.</p></div>';console.error(error);}})();
</script>
