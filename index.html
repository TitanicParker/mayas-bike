<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f1e7">
<title>Maya's Bike</title>
<meta name="description" content="Maya's Bike — a book best experienced by listening.">
<style>
:root{--paper:#f6f1e7;--ink:#201d19;--muted:#756e64;--rule:rgba(32,29,25,.12);--accent:#7a4b36;--measure:43rem;--serif:Georgia,'Times New Roman',Times,serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--paper)}body{margin:0;background:var(--paper);color:var(--ink);font:20px/1.72 var(--serif);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}a{color:inherit}
.cover{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;align-items:center;padding:clamp(1.2rem,3vw,2.2rem);background:radial-gradient(circle at 50% 15%,rgba(255,255,255,.75),transparent 30rem),linear-gradient(180deg,#faf6ee,var(--paper));overflow:hidden}.cover-heading{text-align:center}.cover-title{margin:0;font-size:clamp(3.6rem,10vw,8.4rem);font-weight:500;line-height:.88;letter-spacing:-.055em}.listen-recommendation{margin:.8rem auto 0;max-width:32rem;color:var(--accent);font:750 .78rem/1.4 var(--sans);letter-spacing:.1em;text-transform:uppercase}.listen-copy{margin:.55rem auto 0;max-width:31rem;color:var(--muted);font-size:clamp(.95rem,2vw,1.08rem);line-height:1.5}.cover-art{width:min(100%,72rem);margin:auto}.cover-art svg{display:block;width:100%;height:auto;max-height:62svh}.cover-actions{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.65rem;padding:.55rem 0 .15rem}.listen-start{appearance:none;border:0;background:var(--accent);color:#fffaf4;border-radius:999px;padding:.9rem 1.35rem;cursor:pointer;box-shadow:0 10px 28px rgba(80,48,34,.16);font:750 .78rem/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;transition:transform .12s ease,opacity .12s ease}.listen-start:hover,.listen-start:focus-visible{transform:translateY(-1px);outline:none}.listen-start:disabled{opacity:.55;cursor:default;transform:none}.listen-start[hidden]{display:none}.continue{display:flex;align-items:center;gap:.45rem;color:var(--muted);font:650 .66rem/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}.continue span:last-child{font-size:.95rem;letter-spacing:0;animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.book{width:min(calc(100% - 2.2rem),var(--measure));margin:0 auto;padding:clamp(5rem,10vw,9rem) 0 10rem}.loading,.error{color:var(--muted);font:.9rem/1.5 var(--sans)}article>:first-child{margin-top:0}article h1,article h2,article h3{font-family:var(--serif);font-weight:500;line-height:1.08;text-wrap:balance}article h1{margin:0 0 5rem;text-align:center;font-size:clamp(1.15rem,2vw,1.35rem);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}article h2{margin:7rem 0 2.4rem;padding-top:1.6rem;border-top:1px solid var(--rule);font-size:clamp(2rem,5vw,3.25rem);letter-spacing:-.03em}article h2:first-of-type{margin-top:0;padding-top:0;border-top:0}article h3{margin:4rem 0 1.4rem;font-size:1.5rem}article p{margin:0 0 1.35rem;hanging-punctuation:first last}article blockquote{margin:2.8rem 0;padding:.2rem 0 .2rem 1.5rem;border-left:2px solid var(--accent);font-size:1.08em;color:#433c35}article ul,article ol{padding-left:1.4rem;margin:1.5rem 0 2rem}article li{margin:.5rem 0}article hr{width:4rem;margin:5rem auto;border:0;border-top:1px solid var(--rule)}article strong{font-weight:700}article em{font-style:italic}article code{font:.83em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:rgba(122,75,54,.08);padding:.1em .25em;border-radius:.2em}article .speaking{background:rgba(122,75,54,.07);border-radius:.35rem;box-shadow:0 0 0 .28rem rgba(122,75,54,.07);transition:background .25s ease,box-shadow .25s ease}.end{width:min(calc(100% - 2.2rem),var(--measure));margin:0 auto 5.8rem;padding-top:1.4rem;border-top:1px solid var(--rule);color:var(--muted);text-align:center;font:.7rem/1.5 var(--sans)}.end a{text-decoration:none}
.listen-bar{position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;width:min(calc(100% - 1.2rem),38rem);display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.48rem;border:1px solid var(--rule);border-radius:999px;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(16px);box-shadow:0 12px 38px rgba(25,18,13,.14);font-family:var(--sans)}.listen-bar[hidden]{display:none}.listen-control{appearance:none;border:0;background:transparent;color:var(--ink);min-height:2.25rem;padding:0 .78rem;border-radius:999px;cursor:pointer;font:700 .75rem/1 var(--sans)}.listen-control:hover,.listen-control:focus-visible{background:rgba(122,75,54,.09);outline:none}.listen-control.primary{background:var(--accent);color:#fffaf4}.listen-state{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font:600 .7rem/1.25 var(--sans);padding:0 .35rem}.rate{appearance:none;border:0;background:transparent;color:var(--muted);height:2.25rem;border-radius:999px;padding:0 .55rem;font:700 .72rem/1 var(--sans);cursor:pointer}.rate:focus-visible{outline:1px solid var(--rule)}
@media(max-width:640px){body{font-size:18px;line-height:1.68}.cover{padding:.9rem}.cover-title{font-size:clamp(3.4rem,18vw,5.8rem)}.listen-recommendation{font-size:.7rem;margin-top:.65rem}.listen-copy{font-size:.91rem;max-width:26rem}.cover-art svg{max-height:56svh}.book{width:min(calc(100% - 2rem),var(--measure));padding-top:4.7rem}article h1{margin-bottom:4rem}article h2{margin-top:5.5rem}.end{width:min(calc(100% - 2rem),var(--measure))}.listen-bar{justify-content:flex-start}.listen-state{display:none}.listen-control{padding:0 .62rem}.rate{margin-left:auto}}
@media(prefers-color-scheme:dark){:root{--paper:#171512;--ink:#efe9df;--muted:#aaa194;--rule:rgba(239,233,223,.14);--accent:#d49a76}.cover{background:radial-gradient(circle at 50% 18%,rgba(255,255,255,.035),transparent 30rem),var(--paper)}article blockquote{color:#d4cabd}.listen-start,.listen-control.primary{color:#261913}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.continue span:last-child{animation:none}}
@media print{.cover,.end,.listen-bar{display:none}.book{width:100%;max-width:38em;padding:0}body{background:#fff;color:#000;font-size:12pt}article h2{break-before:page;border-top:0}}
</style>
</head>
<body>
<section class="cover" aria-label="Maya's Bike cover">
  <div class="cover-heading">
    <h1 class="cover-title">Maya’s Bike</h1>
    <p class="listen-recommendation">Best experienced by listening</p>
    <p class="listen-copy">This book was written for the ear. Press listen and let the afternoon in the shed unfold.</p>
  </div>
  <div class="cover-art">
    <svg viewBox="0 0 900 700" role="img" aria-label="A bicycle beside a warm garden shed" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5ead2"/><stop offset="1" stop-color="#ecd8b8"/></linearGradient>
        <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7c39d"/><stop offset="1" stop-color="#bea179"/></linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b57a56"/><stop offset="1" stop-color="#8a5a3d"/></linearGradient>
      </defs>
      <rect width="900" height="700" rx="28" fill="url(#sky)"/><rect y="470" width="900" height="230" fill="url(#ground)"/><ellipse cx="690" cy="120" rx="72" ry="38" fill="#fff3dc" opacity=".55"/><ellipse cx="170" cy="105" rx="92" ry="44" fill="#fff6e6" opacity=".55"/>
      <g transform="translate(420 170)"><polygon points="40,80 215,0 395,80 395,300 40,300" fill="#56483b"/><rect x="66" y="86" width="305" height="230" rx="4" fill="url(#wood)" stroke="#744b34" stroke-width="3"/><g stroke="#cf9d74" stroke-width="3" opacity=".75"><line x1="104" y1="86" x2="104" y2="316"/><line x1="140" y1="86" x2="140" y2="316"/><line x1="176" y1="86" x2="176" y2="316"/><line x1="212" y1="86" x2="212" y2="316"/><line x1="248" y1="86" x2="248" y2="316"/><line x1="284" y1="86" x2="284" y2="316"/><line x1="320" y1="86" x2="320" y2="316"/></g><rect x="172" y="148" width="100" height="168" fill="#5f7b67" stroke="#3d5244" stroke-width="4"/><circle cx="255" cy="234" r="5.5" fill="#f2dfc3"/><rect x="92" y="134" width="58" height="54" fill="#d8e8ef" stroke="#5f7b67" stroke-width="4"/><line x1="121" y1="134" x2="121" y2="188" stroke="#5f7b67" stroke-width="3"/><line x1="92" y1="161" x2="150" y2="161" stroke="#5f7b67" stroke-width="3"/></g>
      <path d="M50 700C190 590 330 560 430 520C520 487 620 475 760 470H900V700Z" fill="#d8c29c" opacity=".86"/>
      <g transform="translate(100 315)" stroke-linecap="round" stroke-linejoin="round"><circle cx="105" cy="210" r="82" fill="none" stroke="#2d3a36" stroke-width="10"/><circle cx="320" cy="210" r="82" fill="none" stroke="#2d3a36" stroke-width="10"/><circle cx="215" cy="210" r="16" fill="#2d3a36" stroke="none"/><g stroke="#395046" stroke-width="8" fill="none"><line x1="105" y1="210" x2="215" y2="210"/><line x1="215" y1="210" x2="270" y2="125"/><line x1="270" y1="125" x2="155" y2="125"/><line x1="155" y1="125" x2="105" y2="210"/><line x1="155" y1="125" x2="215" y2="210"/><line x1="270" y1="125" x2="320" y2="210"/></g><line x1="275" y1="115" x2="310" y2="87" stroke="#395046" stroke-width="7"/><line x1="302" y1="84" x2="335" y2="84" stroke="#395046" stroke-width="7"/><line x1="150" y1="125" x2="138" y2="88" stroke="#395046" stroke-width="7"/><line x1="128" y1="88" x2="172" y2="88" stroke="#395046" stroke-width="7"/><circle cx="215" cy="210" r="26" fill="none" stroke="#7a4b36" stroke-width="6"/><path d="M335 94L377 94L389 132L345 132Z" fill="#b57a56" stroke="#744b34" stroke-width="4"/></g>
      <g fill="#5d8b66"><path d="M384 505C370 475 368 445 385 425C392 453 395 475 384 505Z"/><path d="M825 505C811 476 808 446 825 424C834 455 835 476 825 505Z"/></g><g fill="#719c79"><path d="M366 505C346 478 338 456 346 430C362 450 370 476 366 505Z"/><path d="M843 505C863 475 870 451 863 428C848 450 840 476 843 505Z"/></g>
    </svg>
  </div>
  <div class="cover-actions">
    <button class="listen-start" id="listenStart" type="button" disabled>▶ Listen to the book</button>
    <div class="continue" aria-hidden="true"><span>or scroll to read</span><span>↓</span></div>
  </div>
</section>
<main class="book"><article id="manuscript" aria-live="polite"><p class="loading">Opening the book…</p></article></main>
<footer class="end"><a href="https://titanicparker.github.io/">TitanicParker</a> · <a href="https://github.com/TitanicParker/mayas-bike">source</a></footer>
<div class="listen-bar" id="listenBar" hidden role="region" aria-label="Listen to Maya's Bike">
  <button class="listen-control primary" id="playPause" type="button">Pause</button>
  <button class="listen-control" id="stopListen" type="button">Stop</button>
  <div class="listen-state" id="listenState" aria-live="polite">Reading Maya’s Bike</div>
  <select class="rate" id="speechRate" aria-label="Reading speed">
    <option value="0.85">0.85×</option>
    <option value="1" selected>1×</option>
    <option value="1.15">1.15×</option>
    <option value="1.3">1.3×</option>
  </select>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>
const manuscript=document.getElementById('manuscript');
const manuscriptUrl='https://raw.githubusercontent.com/TitanicParker/mayas-bike/main/manuscript.md';
const canSpeak='speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
const listenStart=document.getElementById('listenStart');
const listenBar=document.getElementById('listenBar');
const playPause=document.getElementById('playPause');
const stopListen=document.getElementById('stopListen');
const listenState=document.getElementById('listenState');
const speechRate=document.getElementById('speechRate');
let blocks=[],index=0,active=null,running=false,paused=false,voice=null;
marked.setOptions({gfm:true,breaks:false,mangle:false,headerIds:true});
function chooseVoice(){const voices=speechSynthesis.getVoices();const english=voices.filter(v=>/^en([-_]|$)/i.test(v.lang));const preferred=['Samantha','Daniel','Karen','Moira','Serena','Alex','Ava','Tom'];voice=preferred.map(name=>english.find(v=>v.name.includes(name))).find(Boolean)||english.find(v=>v.localService)||english[0]||voices[0]||null;}
function buildBlocks(){blocks=[...manuscript.querySelectorAll('h1,h2,h3,p,li,blockquote')].filter(el=>el.textContent.trim()).map(el=>({el,text:el.textContent.replace(/\s+/g,' ').trim()}));}
function clearActive(){if(active)active.classList.remove('speaking');active=null;}
function currentTitle(){for(let i=index;i>=0;i--){const el=blocks[i]&&blocks[i].el;if(el&&/^H[123]$/.test(el.tagName))return el.textContent.trim();}return 'Maya’s Bike';}
function speakNext(){if(!running||index>=blocks.length){finish();return;}clearActive();const block=blocks[index];active=block.el;active.classList.add('speaking');listenState.textContent=currentTitle();if(active.getBoundingClientRect().top<80||active.getBoundingClientRect().bottom>window.innerHeight-100)active.scrollIntoView({behavior:'smooth',block:'center'});const u=new SpeechSynthesisUtterance(block.text);if(voice)u.voice=voice;u.rate=parseFloat(speechRate.value)||1;u.pitch=1;u.volume=1;u.onend=()=>{if(!running)return;index++;speakNext();};u.onerror=e=>{if(e.error==='canceled'||e.error==='interrupted')return;index++;speakNext();};speechSynthesis.speak(u);}
function startListening(){if(!canSpeak||!blocks.length)return;speechSynthesis.cancel();chooseVoice();index=0;running=true;paused=false;listenBar.hidden=false;playPause.textContent='Pause';setTimeout(speakNext,80);}
function finish(){speechSynthesis.cancel();running=false;paused=false;clearActive();listenBar.hidden=true;playPause.textContent='Pause';listenState.textContent='Reading Maya’s Bike';}
listenStart.addEventListener('click',startListening);
playPause.addEventListener('click',()=>{if(!running)return;if(paused){speechSynthesis.resume();paused=false;playPause.textContent='Pause';}else{speechSynthesis.pause();paused=true;playPause.textContent='Resume';}});
stopListen.addEventListener('click',finish);
speechRate.addEventListener('change',()=>{if(!running)return;const wasPaused=paused;speechSynthesis.cancel();paused=false;playPause.textContent='Pause';setTimeout(()=>{speakNext();if(wasPaused){setTimeout(()=>{speechSynthesis.pause();paused=true;playPause.textContent='Resume';},120);}},80);});
if(canSpeak){chooseVoice();speechSynthesis.onvoiceschanged=chooseVoice;}else{listenStart.hidden=true;}
(async()=>{try{const response=await fetch(manuscriptUrl,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const markdown=await response.text();manuscript.innerHTML=DOMPurify.sanitize(marked.parse(markdown));buildBlocks();if(canSpeak&&blocks.length)listenStart.disabled=false;}catch(error){manuscript.innerHTML='<div class="error"><p>The book could not be opened just now.</p></div>';listenStart.hidden=true;console.error(error);}})();
window.addEventListener('beforeunload',()=>{if(canSpeak)speechSynthesis.cancel();});
</script>
</body>
</html>
